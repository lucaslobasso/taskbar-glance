name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
      - name: Build (Native AOT)
        run: dotnet publish src/TaskbarGlance.csproj -c Release -o out --nologo
      - name: Checks and README pictures
        run: |
          pip install pillow
          python tests/check.py
          python docs/render.py
      - name: Install scripts parse
        run: |
          foreach ($f in 'install.ps1', 'uninstall.ps1', 'bootstrap.ps1', 'install-lib.ps1') {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $errors | Format-List; exit 1 }
          }
