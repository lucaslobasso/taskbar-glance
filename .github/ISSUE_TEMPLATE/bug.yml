name: Bug report
description: Something looks wrong or doesn't work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected. A screenshot helps a lot.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Taskbar Glance version
      description: "The release you installed (TaskbarGlance.exe → Properties → Details)"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version and taskbar scaling
      placeholder: Windows 11 24H2, 150%
  - type: input
    id: city
    attributes:
      label: City setting
      description: "The \"city\" value in glance.json, if the weather is wrong or missing"
  - type: textarea
    id: log
    attributes:
      label: glance.log
      description: "The last lines of %LOCALAPPDATA%\\TaskbarGlance\\glance.log (nothing private is written there)"
      render: text
